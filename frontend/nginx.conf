# nginx config for the web service: serves the static SPA and proxies the API.
# This is the single public entrypoint of the stack.

server {
    listen 80;
    server_name _;

    # gzip for text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # API: forward to the backend service. The backend's own routes live under
    # /api/v1, and we preserve the full path so /api/v1/... maps 1:1.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The chat/LLM round-trip can take a while; don't cut it off early.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hashed build assets can be cached aggressively.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every non-file route returns index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

